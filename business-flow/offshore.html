<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00060f">
<meta name="robots" content="noindex,nofollow">
<title>Embarque/desembarque — ENGLISH FLOW</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>">
<link rel="stylesheet" href="css/style.css?v=3.27">
<link rel="stylesheet" href="css/englishflow.css?v=3.27">
<style>
  .wrap { max-width: 460px; margin: 0 auto; padding: 22px 16px 60px; }
  .mov-opt {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 14px 15px;
    border: 1px solid var(--line); border-radius: 13px; background: var(--card);
    color: var(--tx); font-family: var(--fb); font-size: 15px; cursor: pointer; margin-bottom: 9px;
  }
  .mov-opt .ic { font-size: 20px; }
  .mov-opt.on { border-color: var(--offshore); background: rgba(167, 139, 250, .14); }
  .mov-opt.on .ic { filter: none; }
</style>
</head>
<body>
<div class="wrap">
  <div id="view"></div>
</div>
<div id="toasts"></div>
<script src="js/util.js?v=3.27"></script>
<script src="js/whatsapp.js?v=3.27"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const nome = q.get('a') || '';
  let mov = null; // 'embarque' | 'desembarque'

  function el(tag, cls, html) { return DF.el(tag, cls, html); }

  const v = document.getElementById('view');

  const brand = el('div', 'ef-brand');
  brand.innerHTML =
    '<svg class="ef-wave" viewBox="0 0 40 40" aria-hidden="true">' +
    '<path d="M2 15c6-6 12-6 18 0s12 6 18 0" fill="none" stroke="#2898d0" stroke-width="4.5" stroke-linecap="round"/>' +
    '<path d="M2 25c6-6 12-6 18 0s12 6 18 0" fill="none" stroke="#30a8e0" stroke-width="4.5" stroke-linecap="round" opacity=".55"/>' +
    '</svg>' +
    '<div class="ef-name">English<em>Flow</em></div>';
  v.appendChild(brand);

  v.appendChild(el('div', 'wk-unit', '⚓ Embarque / desembarque'));
  v.appendChild(el('div', 'wk-hello',
    (nome ? 'Olá, ' + DF.esc(nome) + '. ' : '') +
    'Avise o professor quando embarcar ou desembarcar — ele ajusta sua cota de aulas.'));

  const panel = el('div', 'panel');
  panel.style.marginTop = '16px';
  panel.appendChild(el('label', 'lbl', 'O que vai acontecer?'));

  const optEmb = el('button', 'mov-opt', '<span class="ic">🛫</span><span>Vou <b>embarcar</b> (início do período offshore)</span>');
  optEmb.type = 'button';
  const optDes = el('button', 'mov-opt', '<span class="ic">🛬</span><span>Vou <b>desembarcar</b> (volto pra terra)</span>');
  optDes.type = 'button';
  function marcar(qual) {
    mov = qual;
    optEmb.classList.toggle('on', qual === 'embarque');
    optDes.classList.toggle('on', qual === 'desembarque');
  }
  optEmb.onclick = function () { marcar('embarque'); };
  optDes.onclick = function () { marcar('desembarque'); };
  panel.appendChild(optEmb);
  panel.appendChild(optDes);

  panel.appendChild(el('label', 'lbl', 'Data'));
  const dataInp = el('input', 'inp');
  dataInp.type = 'date';
  dataInp.min = DF.todayKey();
  panel.appendChild(dataInp);

  const send = el('a', 'btn wa wide', '📤 Avisar o professor no WhatsApp');
  send.target = '_blank'; send.style.marginTop = '14px';
  send.onclick = function (e) {
    if (!mov) { e.preventDefault(); DF.toast('Escolha embarque ou desembarque.'); return; }
    if (!dataInp.value) { e.preventDefault(); DF.toast('Escolha a data.'); return; }
    const d = new Date(dataInp.value + 'T00:00:00');
    const dataFmt = DF.fmtDate(d);
    const msg = '⚓ ENGLISH FLOW — aviso de ' + mov + '\n' +
      'Aluno: ' + (nome || '—') + '\n' +
      (mov === 'embarque' ? 'Embarca em: ' : 'Desembarca em: ') + dataFmt;
    send.href = DF.WA.link(msg);
  };
  send.href = '#';
  panel.appendChild(send);
  v.appendChild(panel);

  v.appendChild(el('p', 'muted small center',
    'Isso manda uma mensagem pro professor — não atualiza nada sozinho. Ele confirma com você e ajusta o calendário.'));
})();
</script>
</body>
</html>
